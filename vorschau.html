function mins(v){return Math.floor(v/100)*60+v%100}
function classify(t){
var s=t.toLowerCase(),r=[];
var w=/wort-?gottes|wortgottes|wortliturgie/.test(s);
if(/beicht|versöhnung|aussprache/.test(s)&&!/keine beicht/.test(s))r.push("b");
if(!w&&/messe|messfeier|eucharistiefeier|eucharistie(?!che)|amt\b|(?<!wort)liturgie|requiem|firmung/.test(s))r.push("m");
if(/anbetung|aussetzung|sakramentsandacht|holy hour|eucharistischer segen/.test(s))r.push("a");
if(/rosenkranz|andacht|novene|gebet|taizé|lobpreis|vigil|wallfahrt|friedens/.test(s))r.push("r");
if(/vesper|laudes|komplet|mittagshore|evensong|abendlob/.test(s))r.push("h");
if(w)r.push("w");
if(!r.length){
if(/konzert|musik und literatur|basar|elternabend|café|bewegung|orange day|mietergewerk|bibelfrühst|seniorennachm|zeit für mich|atem\.pause|meditation|gemeinsam in stille|denken|lectio|katechese|agape|segnung der advent|gebetskreis/.test(s))r.push("o");
else if(/gottesdienst|feier|kinderkirche|trauer/.test(s))r.push("g");
else r.push("o");
}
return r;
}
function cleanName(n,addr){
n=n.replace(/^[-\s]+/,"").replace(/\s+/g," ").trim();
var odd=/^(Kleiner Saal|Chorkapelle|der Neuen Kirche|Allerheiligen|Franziskussaal|Sebastianskapelle|Nikolauskirche|Winthirkirche|Bürgersaalkirche|St\. Johann Baptist|Maria-Stadler-Haus|Klinikum rechts der Isar|im .*|Seniorenresidenz.*)$/i.test(n);
if(odd){var m=/\d{5}\s+(.+)$/.exec(addr||"");if(m)n+=" · "+m[1]}
return n.replace("der Neuen Kirche","Neue Kirche");
}
function proj(lat,lon){
var s=Math.sin(lat*Math.PI/180);
return[(lon+180)/360,0.5-Math.log((1+s)/(1-s))/(4*Math.PI)];
}
function toScr(p){return[W/2+(p[0]-view.x)*view.k,H/2+(p[1]-view.y)*view.k]}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

/* ---------- Kacheln (OpenStreetMap), farblich harmonisiert ---------- */
var tiles={},rq=0;
function redraw(){if(rq)return;rq=requestAnimationFrame(function(){rq=0;draw()})}
function tile(z,x,y){
var key=z+"/"+x+"/"+y,t=tiles[key];
if(t)return t;
t=tiles[key]=new Image();t.loaded=false;
t.onload=function(){t.loaded=true;redraw()};
t.src="https://tile.openstreetmap.org/"+key+".png";
return t;
}
function drawTiles(){
var z=Math.round(Math.log(view.k/256)/Math.LN2);z=Math.max(8,Math.min(18,z));
var n=Math.pow(2,z),size=view.k/n;
var x0=Math.floor((view.x-W/2/view.k)*n),x1=Math.floor((view.x+W/2/view.k)*n);
var y0=Math.floor((view.y-H/2/view.k)*n),y1=Math.floor((view.y+H/2/view.k)*n);
for(var x=x0;x<=x1;x++)for(var y=y0;y<=y1;y++){
if(x<0||y<0||x>=n||y>=n)continue;
var t=tile(z,x,y);if(!t.loaded)continue;
var s=toScr([x/n,y/n]);
ctx.drawImage(t,Math.round(s[0]),Math.round(s[1]),Math.ceil(size)+1,Math.ceil(size)+1);
}
ctx.save();
ctx.globalCompositeOperation="saturation";ctx.globalAlpha=.78;ctx.fillStyle="#808080";ctx.fillRect(0,0,W,H);
ctx.globalAlpha=1;
if(dark&&dark.matches){ctx.globalCompositeOperation="source-over";ctx.fillStyle="rgba(10,24,40,.76)";ctx.fillRect(0,0,W,H)}
else{ctx.globalCompositeOperation="multiply";ctx.fillStyle="#F7F0E1";ctx.fillRect(0,0,W,H)}
ctx.restore();
}

/* ---------- Daten aufbereiten ---------- */
function build(){
var from=S.from,to=S.to,d=S.day,evOf={};
D.events.forEach(function(e){
if(e[1]!==d)return;
var st=mins(e[2]);if(st<from||st>to)return;
var ty=D.types[e[4]],hit=false;
for(var j=0;j<ty.length;j++)if(S.on[ty[j]]){hit=true;break}
if(!hit)return;
(evOf[e[0]]=evOf[e[0]]||[]).push(e);
});
PINS=[];
Object.keys(evOf).forEach(function(k){
var pl=D.places[k],evs=evOf[k].sort(function(a,b){return a[2]-b[2]});
var best="o",bp=99;
evs.forEach(function(e){D.types[e[4]].forEach(function(t){if(S.on[t]){var p=PRIO.indexOf(t);if(p<bp){bp=p;best=t}}})});
PINS.push({pi:+k,p:proj(pl[1],pl[2]),evs:evs,type:best,x:0,y:0});
});
var nt=PINS.reduce(function(a,p){return a+p.evs.length},0);
document.getElementById('count').innerHTML="<b>"+PINS.length+"</b> Kirchen · <b>"+nt+"</b> Termine";
var msg=document.getElementById('msg');
msg.hidden=PINS.length>0;msg.textContent="Keine Gottesdienste in diesem Zeitfenster.";
if(S.sel>=0&&!PINS.some(function(p){return p.pi===S.sel}))closePanel();
if(!moved)fit();
draw();
if(S.sel>=0)openPanel(S.sel);
badge();
}
function badge(){
var n=0;CATS.forEach(function(c){if(!S.on[c[0]])n++});
var t1=document.getElementById('t1'),t2=document.getElementById('t2');
if(t1&&(t1.value!==S.df||t2.value!==S.dt))n++;
var b=document.getElementById('fbadge');b.hidden=!n;b.textContent=n;
}
function fit(){
var pts=PINS.map(function(p){return p.p}).concat([proj(HOME[0],HOME[1])]);
var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
pts.forEach(function(p){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])});
var w=Math.max(x1-x0,1e-5),h=Math.max(y1-y0,1e-5);
var k=Math.min((W-90)/w,(H-110)/h);
view.k=Math.max(KMIN*8,Math.min(k,KMIN*512));
view.x=(x0+x1)/2;view.y=(y0+y1)/2-14/view.k;
}

/* ---------- Zeichnen ---------- */
function pinPath(x,y,r){
ctx.beginPath();var cy=y-r*1.9;
ctx.moveTo(x,y);
ctx.bezierCurveTo(x-r*.35,y-r*.85,x-r,cy+r*.9,x-r,cy);
ctx.arc(x,cy,r,Math.PI,0);
ctx.bezierCurveTo(x+r,cy+r*.9,x+r*.35,y-r*.85,x,y);
ctx.closePath();
}
function glyph(n,cx,cy,s,col,lw){
ctx.save();ctx.translate(cx-s/2,cy-s/2);ctx.scale(s/24,s/24);
ctx.strokeStyle=col;ctx.lineWidth=lw||2;ctx.lineCap="round";ctx.lineJoin="round";ctx.stroke(P2[n]);ctx.restore();
}
function draw(){
if(!W||!D)return;
ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.fillStyle=css('--map');ctx.fillRect(0,0,W,H);
drawTiles();
var gold=css('--gold'),navy=css('--navy'),pin=css('--pin'),dk=dark&&dark.matches;
/* Zuhause */
var h=toScr(proj(HOME[0],HOME[1]));
ctx.save();ctx.shadowColor="rgba(16,43,70,.35)";ctx.shadowBlur=5;ctx.shadowOffsetY=1.5;
ctx.fillStyle=css('--slate');ctx.beginPath();ctx.arc(h[0],h[1],12,0,7);ctx.fill();ctx.restore();
ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();ctx.arc(h[0],h[1],12,0,7);ctx.stroke();
glyph("home",h[0],h[1]-.5,15,"#fff",2.2);
ctx.font="600 11.5px Inter,system-ui,sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";
ctx.lineJoin="round";ctx.lineWidth=3.5;ctx.strokeStyle=dk?"rgba(13,31,51,.9)":"rgba(247,240,225,.95)";ctx.strokeText("Zuhause",h[0]+17,h[1]);
ctx.fillStyle=dk?"#E8EEF4":css('--slate');ctx.fillText("Zuhause",h[0]+17,h[1]);
/* Kirchen */
PINS.forEach(function(p){var s=toScr(p.p);p.x=s[0];p.y=s[1]});
var order=PINS.slice().sort(function(a,b){return a.y-b.y});
order.forEach(function(p){
if(p.x<-30||p.x>W+30||p.y<-10||p.y>H+50)return;
var act=(p.pi===S.sel||p.pi===S.hover),r=act?15:12;
ctx.save();ctx.shadowColor="rgba(16,43,70,.4)";ctx.shadowBlur=act?10:6;ctx.shadowOffsetY=2;
pinPath(p.x,p.y,r);ctx.fillStyle=act?gold:pin;ctx.fill();ctx.restore();
pinPath(p.x,p.y,r);ctx.strokeStyle=act?(dk?"#fff":navy):gold;ctx.lineWidth=act?2.2:1.8;ctx.stroke();
var cy=p.y-r*1.9;
glyph(p.type,p.x,cy,r*1.2,act?navy:"#fff",2.1);
if(p.evs.length>1){
var bx=p.x+r*.82,by=cy-r*.86,t=p.evs.length>99?"99+":String(p.evs.length);
ctx.fillStyle=gold;ctx.beginPath();ctx.arc(bx,by,7.5,0,7);ctx.fill();
ctx.strokeStyle=dk?"#0D1F33":"#fff";ctx.lineWidth=1.5;ctx.stroke();
ctx.fillStyle=navy;ctx.font="700 "+(t.length>2?7:9.5)+"px Inter,system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(t,bx,by+.5);
}
});
}
function hit(mx,my){
var best=null,bd=1e9;
PINS.forEach(function(p){
var cy=p.y-23,d=Math.hypot(mx-p.x,my-cy);
if(d<=17&&d<bd){bd=d;best=p}
});
return best;
}
function resize(){
var w=box.clientWidth,h=box.clientHeight;if(!w||!h)return;
W=w;H=h;dpr=window.devicePixelRatio||1;
cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
if(D){if(!moved)fit();draw()}
}

/* ---------- Bedienung der Karte ---------- */
var ptrs={},drag=null,pinch=null,moveDist=0;
function zoomAt(f,mx,my){
var nk=Math.max(KMIN,Math.min(KMAX,view.k*f));f=nk/view.k;
view.x+=(mx-W/2)/view.k*(1-1/f);view.y+=(my-H/2)/view.k*(1-1/f);view.k=nk;moved=true;draw();
}
function reveal(p){
var dx=0,dy=0;
if(mob&&mob.matches){var lim=H*.5-70;if(p.y>lim||p.y-45<60)dy=p.y-H*.27}
else{var pw=W-420;if(p.x>pw)dx=p.x-pw*.55}
if(dx||dy){view.x+=dx/view.k;view.y+=dy/view.k;moved=true}
}
cv.addEventListener('pointerdown',function(e){
cv.setPointerCapture(e.pointerId);var r=cv.getBoundingClientRect();
ptrs[e.pointerId]=[e.clientX-r.left,e.clientY-r.top];moveDist=0;
var ids=Object.keys(ptrs);
if(ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])};drag=null}
else{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}}
cv.classList.add('drag');
});
cv.addEventListener('pointermove',function(e){
var r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
if(ptrs[e.pointerId]){
ptrs[e.pointerId]=[mx,my];
var ids=Object.keys(ptrs);
if(ids.length===2&&pinch){
var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a[0]-b[0],a[1]-b[1]);
zoomAt(d/pinch.d,(a[0]+b[0])/2,(a[1]+b[1])/2);pinch.d=d;moveDist=99;
}else if(drag){
var dx=e.clientX-drag.x,dy=e.clientY-drag.y;moveDist=Math.max(moveDist,Math.hypot(dx,dy));
if(moveDist>4){view.x=drag.vx-dx/view.k;view.y=drag.vy-dy/view.k;moved=true;draw();hideTip()}
}
return;
}
if(e.pointerType==='mouse'){
var p=hit(mx,my),id=p?p.pi:-1;
if(id!==S.hover){S.hover=id;cv.style.cursor=p?"pointer":"grab";draw()}
if(p)showTip(p,mx,my);else hideTip();
}
});
function up(e){
var was=ptrs[e.pointerId];delete ptrs[e.pointerId];
if(Object.keys(ptrs).length<2)pinch=null;
if(!Object.keys(ptrs).length){cv.classList.remove('drag');
if(was&&moveDist<=4&&e.type==='pointerup'){var p=hit(was[0],was[1]);if(p){S.sel=p.pi;reveal(p);openPanel(p.pi);hideTip();draw()}else{closePanel()}}
drag=null}
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse'){S.hover=-1;hideTip();draw()}});
cv.addEventListener('wheel',function(e){e.preventDefault();var r=cv.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*0.0016),e.clientX-r.left,e.clientY-r.top)},{passive:false});
document.getElementById('zi').onclick=function(){zoomAt(1.5,W/2,H/2)};
document.getElementById('zo').onclick=function(){zoomAt(1/1.5,W/2,H/2)};
document.getElementById('zf').onclick=function(){moved=false;fit();draw()};

/* Vollbild: echte Fullscreen-API, auf dem iPhone Ersatz per CSS */
var app=document.getElementById('app'),fsb=document.getElementById('fs');
function isFS(){return app.classList.contains('fs')}
function setFS(on){app.classList.toggle('fs',on);fsb.innerHTML=ic(on?'fsx':'fs',20);fsb.setAttribute('aria-label',on?'Vollbild beenden':'Vollbild');setTimeout(resize,80)}
fsb.onclick=function(){
if(!isFS()){
var rq2=app.requestFullscreen||app.webkitRequestFullscreen;
if(rq2&&!/iPhone|iPad|iPod/.test(navigator.userAgent)){try{var pr=rq2.call(app);if(pr&&pr.catch)pr.catch(function(){})}catch(e){}}
setFS(true);
}else{
if(document.fullscreenElement||document.webkitFullscreenElement){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}}
setFS(false);
}
};
document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&isFS())setFS(false);else setTimeout(resize,80)});

/* Tooltip */
var tip=document.getElementById('tip');
function pname(i){var pl=D.places[i];return cleanName(pl[0],pl[3])}
function showTip(p,mx,my){
var e=p.evs[0],more=p.evs.length-1;
tip.innerHTML="<b>"+esc(pname(p.pi))+"</b><span>"+hm(e[2])+" · "+esc(D.titles[e[4]])+(more>0?" · +"+more+" weitere":"")+"</span>";
tip.hidden=false;
var tw=tip.offsetWidth,th=tip.offsetHeight,x=mx+16,y=my-th-34;
if(x+tw>W-6)x=mx-tw-16;if(y<6)y=my+16;
tip.style.left=Math.max(6,x)+"px";tip.style.top=y+"px";
}
function hideTip(){tip.hidden=true}

/* Panel */
var panel=document.getElementById('panel'),pbody=document.getElementById('pbody');
function closePanel(){S.sel=-1;panel.hidden=true;panel.classList.remove('full');draw()}
function openPanel(i){
var pl=D.places[i],par=D.parishes[pl[4]]||["","",""],pv=(par[1]||"").trim();
var p=PINS.filter(function(x){return x.pi===i})[0];if(!p)return;
var parLine="";
if(par[0]){
var nm=esc(par[0]);if(par[2])nm='<a href="'+esc(par[2])+'" target="_blank" rel="noopener">'+nm+'</a>';
parLine='<div class="pf">Pfarrei: '+nm+(pv?' <span style="opacity:.7">· '+esc(pv)+'</span>':'')+'</div>';
}
var gm="https://www.google.com/maps/search/?api=1&query="+pl[1]+","+pl[2];
var li=p.evs.map(function(e){
var ty=D.types[e[4]].filter(function(t){return S.on[t]});
if(!ty.length)ty=D.types[e[4]];
var tg=ty.map(function(t){return '<span class="tag">'+ic(t,14)+LBL[t]+'</span>'}).join("");
var note=e[5]?'<div class="nt">'+esc(e[5].length>150?e[5].slice(0,150)+"…":e[5])+'</div>':'';
return '<li class="ev"><div><time>'+hm(e[2])+'</time>'+(e[3]?'<div class="to">bis '+hm(e[3])+'</div>':'')+'</div><div class="t">'+esc(D.titles[e[4]])+'<div class="tg">'+tg+'</div></div>'+note+'</li>';
}).join("");
pbody.innerHTML='<div class="ph"><button class="x" aria-label="Schließen">'+ic('x',18)+'</button><h2>'+esc(pname(i))+'</h2><div class="ad">'+esc(pl[3])+'</div>'+parLine+'<a class="gm" href="'+gm+'" target="_blank" rel="noopener">'+ic('map',17)+'In Google Maps öffnen</a></div><ul class="ls">'+li+'</ul>';
pbody.querySelector('.x').onclick=closePanel;
panel.hidden=false;S.sel=i;
}
/* Panel als Bottom-Sheet (Handy): ziehen oder tippen */
(function(){
var g=document.getElementById('grab'),y0=0,act=false;
g.addEventListener('pointerdown',function(e){act=true;y0=e.clientY;g.setPointerCapture(e.pointerId);panel.style.transition="none"});
g.addEventListener('pointermove',function(e){if(!act)return;var dy=e.clientY-y0;panel.style.transform="translateY("+Math.max(0,dy)+"px)"});
function end(e){
if(!act)return;act=false;var dy=e.clientY-y0;panel.style.transition="";panel.style.transform="";
if(dy>70){if(panel.classList.contains('full'))panel.classList.remove('full');else closePanel()}
else if(dy<-50)panel.classList.add('full');
else if(Math.abs(dy)<6)panel.classList.toggle('full');
}
g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
})();

/* Filter-Sheet (Handy) und Info */
var filters=document.getElementById('filters'),scrim=document.getElementById('scrim'),info=document.getElementById('info');
function openF(o){filters.classList.toggle('open',o);scrim.hidden=!o}
document.getElementById('fbtn').onclick=function(){openF(true)};
document.getElementById('fclose').onclick=function(){openF(false)};
scrim.onclick=function(){openF(false)};
document.getElementById('ibtn').onclick=function(){info.hidden=false};
info.onclick=function(e){if(e.target===info||e.target.id==='iclose')info.hidden=true};
document.addEventListener('keydown',function(e){
if(e.key!=="Escape")return;
if(!info.hidden)info.hidden=true;else if(filters.classList.contains('open'))openF(false);else if(S.sel>=0)closePanel();else if(isFS()&&!document.fullscreenElement)setFS(false);
});

/* ---------- Oberfläche aufbauen ---------- */
function setupUI(){
document.getElementById('lg1').innerHTML=LOGO;document.getElementById('lg2').innerHTML=LOGO;
document.getElementById('orn').innerHTML=ORN;
document.getElementById('ibtn').innerHTML=ic('info',21);
document.getElementById('fbi').innerHTML=ic('filter',18);
document.getElementById('zi').innerHTML=ic('plus',20);document.getElementById('zo').innerHTML=ic('minus',20);
document.getElementById('zf').innerHTML=ic('fit',20);fsb.innerHTML=ic('fs',20);
var gen=D.generated.split("-").reverse().join(".");
document.getElementById('sub').textContent="Stand "+gen.slice(0,5)+(D.time?", "+D.time+" Uhr":"");
document.getElementById('infobd').innerHTML='<p>Messen, Beichtgelegenheiten, Andachten und weitere Gottesdienste in München, Freising, Erding und Umgebung – an einem Tag, auf der Karte.</p><p>Quelle: Gottesdienstkalender und Bistumskarte des Erzbistums München und Freising. Stand: '+esc(gen)+(D.time?', '+esc(D.time)+' Uhr':'')+'. Angaben ohne Gewähr, bitte im Zweifel beim Pfarrbüro nachfragen.</p><p class="mut">Privates Projekt, keine offizielle Seite des Erzbistums. Kartendaten © OpenStreetMap-Mitwirkende (ODbL).</p><button id="iclose">Schließen</button>';
document.getElementById('timebox').innerHTML='<label class="tf">'+ic('clock',17)+'<span>Von</span><input type="time" id="t1"></label><label class="tf">'+ic('clock',17)+'<span>Bis</span><input type="time" id="t2"></label>';
var base=new Date(D.base+"T12:00:00");
var dbox=document.getElementById('days'),now=new Date();
var todayIdx=Math.round((new Date(now.getFullYear(),now.getMonth(),now.getDate())-new Date(base.getFullYear(),base.getMonth(),base.getDate()))/864e5);
var maxDay=0;D.events.forEach(function(e){if(e[1]>maxDay)maxDay=e[1]});
var isToday=todayIdx>=0&&todayIdx<=maxDay;
S.day=isToday?todayIdx:0;
var t1=document.getElementById('t1'),t2=document.getElementById('t2');
function rd(){var a=t1.value.split(":"),b=t2.value.split(":");S.from=(+a[0])*60+(+a[1]||0);S.to=(+b[0])*60+(+b[1]||0)}
function setTimes(today){
var f="00:00";
if(today){var n=new Date();f=pad(n.getHours())+":"+pad(n.getMinutes())}
t1.value=f;t2.value="23:59";S.df=f;S.dt="23:59";rd();
}
function sync(){[].forEach.call(dbox.children,function(c){var on=+c.dataset.i===S.day;c.setAttribute('aria-pressed',on);if(on){dbox.scrollLeft=c.offsetLeft-dbox.clientWidth/2+c.offsetWidth/2}})}
for(var i=0;i<=maxDay;i++){
var dt=new Date(base.getTime()+i*864e5);
var b=document.createElement('button');b.className='day'+(i===todayIdx?' today':'');b.dataset.i=i;
b.innerHTML="<span>"+(i===todayIdx?"Heute":WD[dt.getDay()])+"</span><small>"+dt.getDate()+"."+(dt.getMonth()+1)+".</small>";
b.onclick=function(){S.day=+this.dataset.i;setTimes(S.day===todayIdx);sync();build()};
dbox.appendChild(b);
}
t1.onchange=t2.onchange=function(){rd();build()};
setTimes(isToday);sync();
var cb=document.getElementById('chips');
CATS.forEach(function(c){
S.on[c[0]]=true;
var b=document.createElement('button');b.className='chip';
b.setAttribute('aria-pressed','true');b.innerHTML=ic(c[0],18)+c[1];
b.onclick=function(){S.on[c[0]]=!S.on[c[0]];b.setAttribute('aria-pressed',S.on[c[0]]);build()};
cb.appendChild(b);
});
}

fetch('data.json?v='+Date.now()).then(function(r){return r.json()}).then(function(d){
D=d;D.types=D.titles.map(classify);
setupUI();resize();build();
}).catch(function(){document.getElementById('msg').textContent="Daten konnten nicht geladen werden."});
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(box);
if(dark)dark.addEventListener('change',draw);
})();
</script>
</body></html>
